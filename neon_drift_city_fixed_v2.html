<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON DRIFT — City Circuit</title>
<style>
:root{--cyan:#42e9ff;--glass:rgba(7,15,25,.78);--line:rgba(117,225,255,.34)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d14;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:linear-gradient(145deg,rgba(8,18,29,.86),rgba(10,19,29,.55));border:1px solid var(--line);box-shadow:0 8px 32px #0006;backdrop-filter:blur(10px);border-radius:14px}
#brand{position:absolute;left:16px;top:14px;padding:10px 14px;letter-spacing:.13em;font-weight:900;font-size:14px}#brand span{color:var(--cyan)}
#stats{position:absolute;right:15px;top:14px;padding:12px 16px;min-width:142px;text-align:right}
#speed{font-size:34px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}#speed small{font-size:11px;color:#9eb5c4;letter-spacing:.14em}#gear{font-size:12px;color:var(--cyan);margin-top:4px}
#drift{position:absolute;top:115px;right:16px;text-align:right;font-size:13px;font-weight:800;color:#bdf8ff;text-shadow:0 0 16px #20dfff;opacity:0;transition:opacity .15s}
#hint{position:absolute;left:50%;top:15px;transform:translateX(-50%);font-size:11px;color:#c7d7df;letter-spacing:.08em;text-align:center;white-space:nowrap}
#help{position:absolute;left:16px;bottom:16px;padding:9px 12px;font-size:11px;color:#c3d2db;max-width:270px}
#reset{position:absolute;right:15px;bottom:16px;pointer-events:auto;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--glass);color:#eafaff;font-weight:800}
#controls{position:absolute;inset:0;pointer-events:none}
#steerPad{display:none}#steerButtons{position:absolute;left:18px;bottom:28px;display:flex;gap:12px;pointer-events:auto} .steerBtn{width:68px;height:78px;border-radius:15px;border:1px solid #a8eaf755;background:linear-gradient(150deg,#183346ed,#07131df0);color:#e9fbff;font-size:28px;font-weight:900;touch-action:none;user-select:none}.steerBtn.active{background:linear-gradient(150deg,#087e9b,#092537);box-shadow:0 0 22px #28dfff55}
#stick{position:absolute;left:43px;top:43px;width:54px;height:54px;border-radius:50%;background:linear-gradient(145deg,#bafaff,#258da8);box-shadow:0 3px 18px #22dfff66;border:2px solid #e5ffff}
#pedals{position:absolute;right:20px;bottom:25px;display:flex;gap:10px;align-items:flex-end;pointer-events:auto}
.pedal{width:68px;height:84px;border-radius:15px;border:1px solid #a8eaf755;background:linear-gradient(150deg,#183346dd,#07131de8);color:#e9fbff;font-size:11px;font-weight:900;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px;touch-action:none;user-select:none}
.pedal strong{font-size:24px;line-height:1}.pedal.active{background:linear-gradient(150deg,#087e9b,#092537);box-shadow:0 0 22px #28dfff55}
#handbrake{height:64px;width:60px;color:#ffb3b3}
@media (min-width:800px){#help{max-width:360px}}
@media (max-height:480px){#steerButtons{left:12px;bottom:12px;gap:8px}.steerBtn{height:62px;width:58px}#pedals{bottom:12px;right:12px}.pedal{height:65px;width:59px}#help{display:none}#stats{top:10px}#brand{top:10px}#hint{top:10px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div id="brand" class="panel">NEON <span>DRIFT</span> <small style="font-size:9px;color:#8ca6b7">/ CITY CIRCUIT</small></div>
  <div id="hint">WASD / OK TUŞLARI • SPACE EL FRENİ</div>
  <div id="stats" class="panel"><div id="speed">000 <small>KM/H</small></div><div id="gear">D  ·  CITY RUN</div></div>
  <div id="drift">DRIFT ANGLE <span id="angle">00°</span><br><span id="score">0</span> PTS</div>
  <div id="help" class="panel">Sürüş: gaz + yön tuşları. El freniyle aracı yanlat. Bariyerler çarpışma yapar; kavşaklar ve şehir yolları keşfedilebilir.</div>
  <button id="reset">↻ YENİDEN BAŞLAT</button>
  <div id="controls">
    <div id="steerPad"><div id="stick"></div></div>
    <div id="steerButtons"><button class="steerBtn" id="leftBtn">◀</button><button class="steerBtn" id="rightBtn">▶</button></div>
    <div id="pedals">
      <div class="pedal" id="brake"><strong>▾</strong>FREN</div>
      <div class="pedal" id="handbrake"><strong>✦</strong>EL FRENİ</div>
      <div class="pedal" id="gas"><strong>▲</strong>GAZ</div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=> {
const root=document.getElementById('game');
if(!window.THREE){root.innerHTML='<div style="padding:24px;color:white">3D motor yüklenemedi. İnternet bağlantısını kontrol edip dosyayı yeniden aç.</div>';return;}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9eb3c0);scene.fog=new THREE.Fog(0x9eb3c0,100,440);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,900);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.15));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=false;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdff5ff,0x3e4146,2.0));
const sun=new THREE.DirectionalLight(0xfff0d8,3.1);sun.position.set(-70,100,40);sun.castShadow=false;scene.add(sun);
const mat=(color,roughness=.8,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const asphalt=mat(0x30373d,.96), concrete=mat(0x858b8d), white=mat(0xe7e5d9), yellow=mat(0xf5c84c), grass=mat(0x4e6953), glass=mat(0x102a39,.22,.55), tireMat=mat(0x101316,.9), rimMat=mat(0x9baab1,.27,.8), red=mat(0xff322e,.3), lamp= new THREE.MeshStandardMaterial({color:0xcff7ff,emissive:0x8bdfff,emissiveIntensity:2});
function box(parent,w,h,d,material,x=0,y=0,z=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function plane(w,d,material,x=0,z=0,y=-.1){let m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),material);m.rotation.x=-Math.PI/2;m.position.set(x,y,z);m.receiveShadow=true;scene.add(m);return m}
plane(900,900,grass,0,0,-.22);
// Road network: main crossroad and long avenues
function road(x,z,w,d){plane(w,d,asphalt,x,z,-.08);const curbMat=concrete;
  // curbs on each side
  box(scene,w+.8,.28,.42,curbMat,x,.02,z-d/2-.24);box(scene,w+.8,.28,.42,curbMat,x,.02,z+d/2+.24);
  box(scene,.42,.28,d+.8,curbMat,x-w/2-.24,.02,z);box(scene,.42,.28,d+.8,curbMat,x+w/2+.24,.02,z);
}
road(0,0,34,900);road(0,0,900,34);road(-180,0,24,900);road(180,0,24,900);road(0,-180,900,24);road(0,180,900,24);
// road markings
function dashLine(x,z,len,alongX){for(let p=-len/2;p<len/2;p+=10){if(alongX)box(scene,4,.025,.22,white,x+p,.025,z);else box(scene,.22,.025,4,white,x,.025,z+p)}}
dashLine(0,0,900,true);dashLine(0,0,900,false);dashLine(-180,0,900,true);dashLine(180,0,900,true);dashLine(0,-180,900,false);dashLine(0,180,900,false);
function crosswalk(x,z,vertical=false){for(let i=-4;i<=4;i++){if(!vertical)box(scene,1.5,.035,7,white,x+i*2,.03,z);else box(scene,7,.035,1.5,white,x,.03,z+i*2)}}
for(const c of [-180,0,180])for(const d of [-180,0,180])if(Math.abs(c)<1||Math.abs(d)<1) {crosswalk(c,d+10,false);crosswalk(c+10,d,true)}
// Guardrails along roads, with supports: physical colliders used by vehicle
const barriers=[];
function barrier(x,z,len,axis){let rail;if(axis==='x'){rail=box(scene,len,.45,.24,mat(0xaeb9be,.35,.75),x,.66,z);box(scene,len,.12,.34,mat(0x303c43),x,.35,z);for(let p=-len/2;p<=len/2;p+=4)box(scene,.17,.85,.4,concrete,x+p,.42,z)}else{rail=box(scene,.24,.45,len,mat(0xaeb9be,.35,.75),x,.66,z);box(scene,.34,.12,len,mat(0x303c43),x,.35,z);for(let p=-len/2;p<=len/2;p+=4)box(scene,.4,.85,.17,concrete,x,.42,z+p)}barriers.push({x,z,hx:axis==='x'?len/2:.48,hz:axis==='x'?.48:len/2});}
// Keep the central junction open; no barricades across the driveable lanes.
for(const c of [-180,180]){barrier(c-15,-34,60,'z');barrier(c+15,34,60,'z');barrier(-34,c-15,60,'x');barrier(34,c+15,60,'x');}
// City blocks, buildings, storefronts, windows
const buildingColliders=[];
const buildingMats=[0x8d989c,0xc5b9a5,0x647986,0xb0b8b8,0x7d858d,0xc5cbd0].map(c=>mat(c,.78));
const windowMat=new THREE.MeshStandardMaterial({color:0x8fc7d8,roughness:.23,metalness:.4,emissive:0x19313a,emissiveIntensity:.4});
for(let gx=-4;gx<=4;gx++)for(let gz=-4;gz<=4;gz++){
 const bx=gx*90+45,bz=gz*90+45;if(Math.abs(bx)<39||Math.abs(bz)<39)continue;
 const w=26+Math.random()*24,d=24+Math.random()*24,h=14+Math.random()*56;
 const b=new THREE.Group();b.position.set(bx,0,bz);scene.add(b);
 box(b,w,h,d,buildingMats[Math.floor(Math.random()*buildingMats.length)],0,h/2,0);
 box(b,w+1,.7,d+1,concrete,0,h+.35,0);
 // window grids on two visible faces
 for(let y=4;y<h-1;y+=6.5){for(let xx=-w/2+2;xx<w/2-1;xx+=6.5){box(b,1.25,1.5,.08,windowMat,xx,y,d/2+.05);box(b,.08,1.5,1.25,windowMat,w/2+.05,y,xx*d/w)}}
 // shop awning sometimes
 if(h<28){box(b,w*.75,.25,.8,mat([0x247d91,0xa54d3e,0x3d7654][Math.floor(Math.random()*3)]),0,4,d/2+.5)}
}
// Street lamps and trees on sidewalks
const trunk=mat(0x514236),leaves=mat(0x315744);
for(let i=-320;i<=320;i+=64){for(const side of [-1,1]){
  // street lamp
  let x=side*24,z=i;box(scene,.18,5,.18,concrete,x,2.5,z);box(scene,.18,.18,2.6,concrete,x,4.9,z+side*1.1);let bulb=new THREE.Mesh(new THREE.SphereGeometry(.22,8,8),lamp);bulb.position.set(x,4.8,z+side*2);scene.add(bulb);
  if(i%128===0){let tx=side*34,tz=i+12;box(scene,.65,3,.65,trunk,tx,1.5,tz);let crown=new THREE.Mesh(new THREE.SphereGeometry(2.4,10,8),leaves);crown.position.set(tx,4,tz);crown.castShadow=true;scene.add(crown)}
}}
// Car model, with detailed body, windows, lights, mirrors, exhausts, spoiler and animated wheels
const car=new THREE.Group();scene.add(car);
const chassis=new THREE.Group();car.add(chassis);
const bodyPaint=new THREE.MeshPhysicalMaterial({color:0x087fa9,metalness:.78,roughness:.24,clearcoat:1,clearcoatRoughness:.1});
const darkPaint=mat(0x101a20,.32,.6);
box(chassis,2.1,.48,4.45,bodyPaint,0,.68,0);
box(chassis,1.88,.32,3.7,bodyPaint,0,.91,-.03);
box(chassis,1.7,.7,2.12,bodyPaint,0,1.27,-.25);
const cabin=box(chassis,1.57,.62,1.92,glass,0,1.43,-.35);
box(chassis,1.72,.12,2.02,bodyPaint,0,1.76,-.35);
box(chassis,1.62,.08,.16,darkPaint,0,1.72,.62);
box(chassis,1.65,.08,.13,bodyPaint,0,1.75,-1.36);
// hood seams, grill, bumpers and aero parts
box(chassis,1.25,.16,1.05,bodyPaint,0,.96,1.05);
box(chassis,1.05,.22,.08,darkPaint,0,.68,2.25);
box(chassis,1.65,.14,.16,darkPaint,0,.48,2.2);
box(chassis,1.9,.15,.18,bodyPaint,0,.5,-2.19);
box(chassis,1.4,.13,.08,darkPaint,0,.44,-2.25);
for(let x of [-.65,.65]){box(chassis,.43,.13,.1,lamp,x,.79,2.22);box(chassis,.35,.12,.1,red,x,.78,-2.22);box(chassis,.12,.12,.25,rimMat,x,.62,-2.29)}
// mirrors and door handles
for(const s of [-1,1]){box(chassis,.22,.13,.3,bodyPaint,s*1.08,1.28,.43);box(chassis,.06,.06,.32,darkPaint,s*1.08,1.25,.55);box(chassis,.04,.05,.65,rimMat,s*1.06,.89,-.05);box(chassis,.04,.04,.65,rimMat,s*1.06,.89,-.78)}
// rear wing on uprights
for(const s of [-.62,.62])box(chassis,.08,.36,.08,darkPaint,s,1.16,-1.78);
box(chassis,1.75,.1,.42,darkPaint,0,1.48,-1.88);
const wheels=[];
for(const x of [-1.06,1.06])for(const z of [-1.42,1.42]){
 const pivot=new THREE.Group();pivot.position.set(x,.52,z);car.add(pivot);
 const tire=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.29,24),tireMat);tire.rotation.z=Math.PI/2;tire.castShadow=true;pivot.add(tire);
 const rim=new THREE.Mesh(new THREE.CylinderGeometry(.27,.27,.305,16),rimMat);rim.rotation.z=Math.PI/2;pivot.add(rim);
 const hub=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,.32,12),darkPaint);hub.rotation.z=Math.PI/2;pivot.add(hub);
 for(let k=0;k<5;k++){let spoke=box(pivot,.035,.36,.045,rimMat,0,0,0);spoke.rotation.x=k*Math.PI*2/5;spoke.position.x=.16;spoke.rotation.z=k*Math.PI*2/5;}
 wheels.push({pivot,x,z,front:z>0});
}
// subtle underglow
const under=new THREE.PointLight(0x00cfff,1.4,7);under.position.set(0,.3,0);car.add(under);
car.position.set(0,0,4);
// Smoke particle pool
const smoke=[];const smokeGeo=new THREE.SphereGeometry(1,7,6);const smokeMat=new THREE.MeshStandardMaterial({color:0xbfc6cb,transparent:true,opacity:.3,roughness:1,depthWrite:false});
for(let i=0;i<34;i++){const m=new THREE.Mesh(smokeGeo,smokeMat.clone());m.visible=false;scene.add(m);smoke.push({mesh:m,life:0})}
let smokeIndex=0;
function puff(){for(let k=0;k<2;k++){const p=smoke[smokeIndex++%smoke.length];p.life=.75+Math.random()*.65;p.mesh.visible=true;p.mesh.position.set(car.position.x+(Math.random()-.5)*1.7,.25+Math.random()*.3,car.position.z-1.3+(Math.random()-.5)*1.2);const s=.35+Math.random()*.5;p.mesh.scale.setScalar(s);p.mesh.material.opacity=.28; p.v=new THREE.Vector3((Math.random()-.5)*1.1,.5+Math.random()*1.1,(Math.random()-.5)*1.1)}}
let speed=0,yaw=0,velX=0,velZ=0,steer=0,driftScore=0,drifting=false;
const input={gas:false,brake:false,hand:false,left:false,right:false};let steerTouch=0;
const speedEl=document.getElementById('speed'),driftEl=document.getElementById('drift'),angleEl=document.getElementById('angle'),scoreEl=document.getElementById('score');
function reset(){car.position.set(0,0,4);car.rotation.y=0;chassis.rotation.set(0,0,0);yaw=0;speed=0;velX=velZ=0;driftScore=0;driftEl.style.opacity=0}
document.getElementById('reset').addEventListener('click',reset);
function bindHold(id,key){const el=document.getElementById(id);const on=e=>{e.preventDefault();input[key]=true;el.classList.add('active');try{el.setPointerCapture(e.pointerId)}catch{}};const off=e=>{input[key]=false;el.classList.remove('active')};el.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,off))}
bindHold('gas','gas');bindHold('brake','brake');bindHold('handbrake','hand');
function bindSteer(id,value){const el=document.getElementById(id);const on=e=>{e.preventDefault();steerTouch=value;el.classList.add('active');try{el.setPointerCapture(e.pointerId)}catch{}};const off=()=>{if((value<0&&steerTouch<0)||(value>0&&steerTouch>0))steerTouch=0;el.classList.remove('active')};el.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,off))}
bindSteer('leftBtn',-1);bindSteer('rightBtn',1);
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);
const clock=new THREE.Clock();
function collide(){let hit=false;for(const b of barriers){const dx=car.position.x-b.x,dz=car.position.z-b.z;if(Math.abs(dx)<b.hx+1.05&&Math.abs(dz)<b.hz+1.55){if(Math.abs(dx)/(b.hx+1.12)>Math.abs(dz)/(b.hz+2.1)){car.position.x=b.x+Math.sign(dx||1)*(b.hx+1.13);velX*= -.25}else{car.position.z=b.z+Math.sign(dz||1)*(b.hz+2.12);velZ*= -.25}speed*=.72;hit=true}}return hit}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.035);
 const gas=input.gas||keys.KeyW||keys.ArrowUp,brake=input.brake||keys.KeyS||keys.ArrowDown,hand=input.hand||keys.Space;
 let rawSteer=steerTouch;if(!rawSteer)rawSteer=((keys.KeyA||keys.ArrowLeft)?-1:0)+((keys.KeyD||keys.ArrowRight)?1:0);rawSteer=Math.max(-1,Math.min(1,rawSteer));
 if(gas)speed+=15*dt;else speed-=2.8*dt;if(brake)speed-=24*dt;speed=Math.max(-7,Math.min(47,speed));
 const sp=Math.abs(speed),grip=hand?.84:.25;steer+=(rawSteer-steer)*Math.min(1,dt*8);
 yaw+=steer*dt*(.22+sp*.012)*(speed>=0?1:-1)*(hand?1.32:1);
 const forwardX=Math.sin(yaw),forwardZ=Math.cos(yaw);
 const targetX=forwardX*speed,targetZ=forwardZ*speed;
 // Separate forward and sideways velocity: handbrake reduces sideways grip for a controlled drift.
 const lateralX=Math.cos(yaw),lateralZ=-Math.sin(yaw);
 let forwardVel=velX*forwardX+velZ*forwardZ;
 let sideVel=velX*lateralX+velZ*lateralZ;
 forwardVel+=(speed-forwardVel)*Math.min(1,dt*3.2);
 sideVel*=Math.max(0,1-dt*(hand?0.12:3.0));
 if(hand&&sp>4)sideVel+=steer*sp*1.45*dt;
 velX=forwardX*forwardVel+lateralX*sideVel;
 velZ=forwardZ*forwardVel+lateralZ*sideVel;
 const oldX=car.position.x,oldZ=car.position.z;car.position.x+=velX*dt;car.position.z+=velZ*dt;
 const slip=Math.atan2(velX*forwardZ-velZ*forwardX,Math.max(1,Math.abs(velX*forwardX+velZ*forwardZ)));
 drifting=sp>5&&(Math.abs(slip)>.10||hand&&Math.abs(steer)>.12);
 if(drifting){if(Math.random()<0.62)puff();chassis.rotation.y=0;chassis.rotation.z=-steer*.07;chassis.rotation.y=THREE.MathUtils.clamp(-slip*.55,-.34,.34);driftScore+=Math.round(Math.abs(slip)*sp*dt*12)}else{chassis.rotation.y+=(0-chassis.rotation.y)*dt*3;chassis.rotation.z+=(0-chassis.rotation.z)*dt*3}
 car.rotation.y=yaw;
 wheels.forEach(w=>{if(w.front)w.pivot.rotation.y=steer*.48;w.pivot.children[0].rotation.x+=speed*dt*1.8;w.pivot.children[1].rotation.x+=speed*dt*1.8});
 const hit=collide(oldX,oldZ);if(hit){speed*=.93}
 // camera smooth chase, with look-ahead and a little banking
 const desired=new THREE.Vector3(car.position.x-Math.sin(yaw)*10,5.3+sp*.055,car.position.z-Math.cos(yaw)*10);
 camera.position.lerp(desired,1-Math.exp(-dt*3.2));
 const look=new THREE.Vector3(car.position.x+Math.sin(yaw)*5,1.1,car.position.z+Math.cos(yaw)*5);camera.lookAt(look);camera.rotation.z=THREE.MathUtils.lerp(camera.rotation.z,-steer*.012,dt*2);
 smoke.forEach(p=>{if(p.life>0){p.life-=dt;p.mesh.position.addScaledVector(p.v,dt);p.mesh.scale.multiplyScalar(1+dt*.75);p.mesh.material.opacity=Math.max(0,p.life*.25);if(p.life<=0)p.mesh.visible=false}});
 speedEl.innerHTML=String(Math.round(sp*3.6)).padStart(3,'0')+' <small>KM/H</small>';document.getElementById('gear').textContent=(speed<0?'R':'D')+'  ·  CITY RUN';
 driftEl.style.opacity=drifting?1:0;angleEl.textContent=String(Math.round(Math.abs(slip)*180/Math.PI)).padStart(2,'0')+'°';scoreEl.textContent=driftScore.toLocaleString('tr-TR');
 renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.65))});
})();
</script>
</body></html>
